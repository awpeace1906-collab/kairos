name: content-ci

on:
  push:
    # web/, ios/Sources/ and docs/ are here for the American-English guard,
    # which covers UI copy and docs as well as content — otherwise a British
    # spelling in a Swift or JS string would never trip CI.
    paths:
      - "content/**"
      - "tools/**"
      - "web/**"
      - "ios/Sources/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/content-ci.yml"
  pull_request:
    paths:
      - "content/**"
      - "tools/**"
      - "web/**"
      - "ios/Sources/**"
      - "docs/**"
      - "README.md"
  schedule:
    # Weekly staleness sweep even with no content changes — the tripwire only
    # helps if it runs on a clock, not just on commits.
    - cron: "0 13 * * 1"

jobs:
  validate:
    # Pinned (not ubuntu-latest): that label moves to Ubuntu 26 on
    # 2026-10-19. Bump deliberately after a green run on the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the version-bump guard can read the base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - working-directory: tools
        run: npm install
      - name: Validate schemas + invariants
        working-directory: tools
        run: npm run validate
      - name: Content changes carry a content_version bump
        # Installed iOS apps only re-download a module when content_version
        # goes up, so an edit without a bump never reaches them. Compares with
        # the push's previous head or the PR base; skipped on the schedule.
        working-directory: tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node check-version-bumps.mjs "$BASE_SHA"
      - name: American English guard
        working-directory: tools
        run: npm run check-spelling
      - name: Engine + content regression tests
        working-directory: tools
        run: npm test
      - name: Rebuild derived files and check they were committed
        working-directory: tools
        run: |
          npm run build
          git diff --exit-code ../content/search-index.json ../content/manifest.json \
            || (echo "::error::search-index.json / manifest.json are stale — run 'npm run build' and commit" && exit 1)
      - name: Tier-1 staleness tripwire
        working-directory: tools
        run: npm run check-staleness
