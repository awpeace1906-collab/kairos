name: deploy

# Publishes the whole app to GitHub Pages: the PWA shell at / and the versioned
# content tree at /content/ (what the iOS app polls for OTA updates).
# `npm run deploy` assembles tools/dist/; only the upload step is host-specific —
# swap it for an S3 sync / Cloudflare Pages step to use a different host.

on:
  push:
    branches: [main]
    paths: ["content/**", "web/**", "tools/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: tools
        run: npm install
      - name: Validate + assemble dist/
        working-directory: tools
        env:
          # The public URL clients fetch content from — for GitHub Pages this is
          # https://<owner>.github.io/<repo>/content/ . Set CONTENT_BASE_URL as a
          # repo Variable (Settings > Secrets and variables > Actions > Variables).
          CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
        run: npm run deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
