name: ios-ci

on:
  push:
    paths: ["ios/**", "content/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", "content/**"]

jobs:
  build-and-test:
    # macos-15 ships Xcode 16, which XcodeGen (latest, via brew) now targets —
    # it emits objectVersion 77, unreadable by the Xcode 15.4 on macos-14.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build + run engine tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project Kairos.xcodeproj -scheme Kairos \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
