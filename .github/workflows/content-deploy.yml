name: content-deploy

# Publishes the versioned content bundle to GitHub Pages after content-ci passes.
# Swap this job for an S3 sync / Cloudflare Pages step to use a different host —
# only the "Upload / deploy" steps change; `npm run deploy` stays the same.

on:
  push:
    branches: [main]
    paths: ["content/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: content-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: tools
        run: npm install
      - name: Validate + assemble dist/
        working-directory: tools
        env:
          # The public URL the clients will fetch from. For GitHub Pages this is
          # https://<owner>.github.io/<repo>/ — set it in repo Settings > Pages,
          # or override here.
          CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
        run: npm run deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
