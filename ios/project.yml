name: Kairos
options:
  bundleIdPrefix: app.kairos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  Kairos:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Offline fallback: the canonical content tree, shipped inside the app as a
      # FOLDER REFERENCE (type: folder) so the bundle preserves the directory
      # structure (Content/config/sections.json, Content/modules/...).
      # ContentStore reads Bundle.main first, then swaps in OTA updates.
      - path: ../content
        name: Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairos.Kairos
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kairos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"

  KairosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kairos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kairos.KairosTests

  KairosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kairos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kairos.KairosUITests

schemes:
  Kairos:
    build:
      targets:
        Kairos: all
        KairosTests: [test]
        KairosUITests: [test]
    test:
      targets:
        - KairosTests
        - KairosUITests
