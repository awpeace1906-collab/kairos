name: Kairos
options:
  bundleIdPrefix: app.kairos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  Kairos:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Offline fallback: the canonical content tree, shipped inside the app as a
      # FOLDER REFERENCE (type: folder) so the bundle preserves the directory
      # structure (Content/config/sections.json, Content/modules/...).
      # ContentStore reads Bundle.main first, then swaps in OTA updates.
      - path: ../content
        name: Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairos.Kairos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kairos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
